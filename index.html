<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제7회 NW통신기술경진대회 응원 심사 플랫폼</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .header-inner,
    .card-header,
    .vote-choice-row,
    .summary-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-inner h1 {
      text-align: left;
    }

    .contest-heading > span {
      display: block;
    }

    .contest-heading .edition {
      color: var(--text-sub, #b7c0cc);
      font-size: 0.72em;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .contest-heading .contest-name {
      margin: 0.16em 0;
      background: linear-gradient(90deg, #f08fbd 0%, #d96da9 48%, #f4b0d0 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #e88aba;
      font-size: 1.08em;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
      filter: drop-shadow(0 4px 14px rgba(217, 109, 169, 0.25));
    }

    .contest-heading .platform-name {
      font-size: 0.82em;
      line-height: 1.3;
    }

    .admin-heading .platform-name small {
      color: var(--text-sub, #b7c0cc);
      font-size: 0.7em;
      font-weight: 600;
    }

    .header-actions,
    .badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .header-actions .logout-btn {
      border-radius: 10px;
    }

    .profile-line {
      margin-top: 6px;
      color: var(--text-sub, #b7c0cc);
      font-size: 0.95rem;
    }

    .summary-bar {
      justify-content: flex-start;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .summary-chip,
    .organization-badge,
    .position-badge,
    .vote-count,
    .status-badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .summary-chip,
    .organization-badge {
      background: #253046;
      color: #cbd9f1;
    }

    .position-badge {
      background: #3a2d40;
      color: #f1a7c6;
    }

    .vote-count,
    .status-badge.success {
      background: #203d34;
      color: #94d8bd;
    }

    .status-badge.warning {
      background: #493c24;
      color: #f5d687;
    }

    .admin-project-card,
    .vote-choice {
      cursor: default;
    }

    .project-copy {
      min-width: 0;
      flex: 1;
    }

    .project-copy .project-title {
      display: block;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .project-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .project-actions button {
      padding: 9px 16px;
    }

    .voter-details {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border, #2a2f3a);
      color: var(--text-sub, #b7c0cc);
    }

    .voter-details summary {
      cursor: pointer;
      font-weight: 700;
    }

    .voter-list {
      margin: 12px 0 0 20px;
      line-height: 1.8;
    }

    .empty-state,
    .notice-card {
      padding: 24px;
      border: 1px dashed var(--border, #2a2f3a);
      border-radius: 14px;
      color: var(--text-sub, #b7c0cc);
      text-align: center;
    }

    .notice-card {
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.7;
    }

    .vote-choice {
      display: block;
      color: inherit !important;
    }

    .vote-choice-row {
      justify-content: flex-start;
    }

    .vote-choice input[type="radio"] {
      width: 22px;
      height: 22px;
      margin: 0;
      flex: 0 0 auto;
      accent-color: var(--brand-1, #d67ab1);
    }

    .vote-choice.is-selected {
      border-color: var(--brand-1, #d67ab1) !important;
      box-shadow: 0 0 0 2px rgba(214, 122, 177, 0.22) !important;
    }

    .vote-choice.is-disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .disabled-reason {
      display: block;
      margin-top: 9px;
      color: #e7a5a5;
      font-size: 0.88rem;
    }

    .vote-footer {
      position: sticky;
      bottom: 0;
      z-index: 5;
      margin-top: 22px;
      padding: 16px;
      border: 1px solid var(--border, #2a2f3a);
      border-radius: 14px;
      background: rgba(20, 24, 33, 0.96);
      backdrop-filter: blur(10px);
    }

    .vote-footer button {
      width: 100%;
    }

    .current-vote-status {
      margin-bottom: 12px;
      color: var(--text-sub, #b7c0cc);
      text-align: center;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none !important;
    }

    .user-meta {
      margin-top: 8px;
    }

    @media (max-width: 720px) {
      .header-inner,
      .card-header,
      .vote-choice-row {
        align-items: flex-start;
      }

      .header-inner,
      .card-header {
        flex-direction: column;
      }

      .header-actions,
      .project-actions {
        width: 100%;
      }

      .header-actions button,
      .project-actions button {
        flex: 1;
      }

      .user-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .user-card .action-buttons {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="message-container" id="messageContainer" aria-live="polite"></div>

  <main id="loginPage" class="page active">
    <form class="login-container" onsubmit="login(event)">
      <h2 class="contest-heading">
        <span class="edition">제7회</span>
        <span class="brand contest-name">NW통신기술경진대회</span>
        <span class="platform-name">응원 심사 플랫폼</span>
      </h2>
      <div class="form-group">
        <label for="loginId">아이디</label>
        <input type="text" id="loginId" autocomplete="username" placeholder="아이디를 입력하세요" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
      </div>
      <div style="text-align: center;">
        <button type="submit">로그인</button>
      </div>
    </form>
  </main>

  <main id="adminPage" class="page">
    <header>
      <div class="container header-inner">
        <h1 class="contest-heading admin-heading">
          <span class="edition">제7회</span>
          <span class="brand contest-name">NW통신기술경진대회</span>
          <span class="platform-name">응원 심사 플랫폼 <small>· 관리자</small></span>
        </h1>
        <div class="header-actions">
          <button type="button" class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="container">
      <nav class="tabs" aria-label="관리 메뉴">
        <button type="button" class="tab-btn active" data-tab="projectList" onclick="switchTab('projectList', this)">과제 목록</button>
        <button type="button" class="tab-btn" data-tab="projectRegister" onclick="switchTab('projectRegister', this)">과제 등록</button>
        <button type="button" class="tab-btn" data-tab="judges" onclick="switchTab('judges', this)">심사위원 관리</button>
        <button type="button" class="tab-btn" data-tab="register" onclick="switchTab('register', this)">심사위원 등록</button>
      </nav>

      <section id="projectListTab" class="tab-content active">
        <h2>과제별 투표 현황</h2>
        <div class="header-actions" style="margin-bottom: 18px;">
          <button type="button" class="reset-btn" onclick="resetProjects()">과제 전체 삭제</button>
          <button type="button" class="reset-btn" onclick="resetVotes()">투표 내역 초기화</button>
          <button type="button" class="export-btn" onclick="exportVotesToCSV()">투표 결과 CSV</button>
        </div>
        <div id="voteSummary" class="summary-bar"></div>
        <div id="adminProjectList" class="project-list"></div>
      </section>

      <section id="projectRegisterTab" class="tab-content">
        <h2>평가 대상 과제 등록</h2>
        <form class="card" onsubmit="registerProject(event)">
          <div class="form-group">
            <label for="projectTitle">과제명</label>
            <input type="text" id="projectTitle" placeholder="과제명을 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="projectOrganization">과제 수행 조직</label>
            <select id="projectOrganization" required></select>
          </div>
          <button type="submit">과제 등록</button>
        </form>
      </section>

      <section id="judgesTab" class="tab-content">
        <h2>심사위원 목록</h2>
        <button type="button" class="reset-btn" onclick="resetJudges()">심사위원 전체 삭제</button>
        <div id="judgesList" class="user-list"></div>
      </section>

      <section id="registerTab" class="tab-content">
        <h2>심사위원 등록</h2>
        <form class="card" onsubmit="registerUser(event)">
          <div class="form-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" placeholder="이름을 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" placeholder="아이디를 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="userPosition">직책</label>
            <select id="userPosition" required>
              <option value="">선택하세요</option>
              <option value="그룹장">그룹장</option>
              <option value="담당">담당</option>
            </select>
          </div>
          <div class="form-group">
            <label for="userOrganization">소속 조직</label>
            <select id="userOrganization" required></select>
          </div>
          <button type="submit">심사위원 등록</button>
        </form>
      </section>
    </div>
  </main>

  <main id="judgePage" class="page">
    <header>
      <div class="container header-inner">
        <div>
          <h1><span id="judgeName"></span></h1>
          <div id="judgeProfile" class="profile-line"></div>
        </div>
        <div class="header-actions">
          <button type="button" class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="container">
      <h2>평가 대상 과제</h2>
      <div class="notice-card">
        가장 우수한 과제 하나만 선택할 수 있습니다. <strong>담당님은</strong> 본인과 같은 조직이 수행한 과제에 투표할 수 없으며, <strong>그룹장님</strong>은 모든 과제에 투표할 수 있습니다.
      </div>
      <form id="voteForm" onsubmit="submitVote(event)">
        <div id="judgeProjectList" class="project-list"></div>
        <div class="vote-footer">
          <div id="currentVoteStatus" class="current-vote-status"></div>
          <button type="submit" id="voteSubmitButton">투표하기</button>
        </div>
      </form>
    </div>
  </main>

  <div id="editUserModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editUserTitle">
    <form class="modal-content" onsubmit="updateUser(event)">
      <h3 id="editUserTitle">심사위원 정보 수정</h3>
      <div class="form-group">
        <label for="editName">이름</label>
        <input type="text" id="editName" required>
      </div>
      <div class="form-group">
        <label for="editUserId">아이디</label>
        <input type="text" id="editUserId" required>
      </div>
      <div class="form-group">
        <label for="editPassword">비밀번호</label>
        <input type="text" id="editPassword" required>
      </div>
      <div class="form-group">
        <label for="editPosition">직책</label>
        <select id="editPosition" required>
          <option value="">선택하세요</option>
          <option value="그룹장">그룹장</option>
          <option value="담당">담당</option>
        </select>
      </div>
      <div class="form-group">
        <label for="editOrganization">소속 조직</label>
        <select id="editOrganization" required></select>
      </div>
      <div class="action-buttons">
        <button type="submit">수정</button>
        <button type="button" onclick="closeUserModal()" style="background: #6c757d;">취소</button>
      </div>
    </form>
  </div>

  <div id="editProjectModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="editProjectTitleLabel">
    <form class="modal-content" onsubmit="updateProject(event)">
      <h3 id="editProjectTitleLabel">과제 정보 수정</h3>
      <div class="form-group">
        <label for="editProjectTitle">과제명</label>
        <input type="text" id="editProjectTitle" required>
      </div>
      <div class="form-group">
        <label for="editProjectOrganization">과제 수행 조직</label>
        <select id="editProjectOrganization" required></select>
      </div>
      <div class="action-buttons">
        <button type="submit">수정</button>
        <button type="button" onclick="closeProjectModal()" style="background: #6c757d;">취소</button>
      </div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      setDoc,
      getDocs,
      doc,
      query,
      where,
      getDoc,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const ALL_ORGANIZATIONS = Object.freeze([
      'NW기획담당',
      'NW인사/지원담당',
      'NW인프라그룹',
      '인프라지원담당',
      '수도권인프라담당',
      '경인인프라담당',
      '중부인프라담당',
      '경남인프라담당',
      '경북인프라담당',
      '충청인프라담당',
      '호남인프라담당'
    ]);

    const TARGET_ORGANIZATIONS = Object.freeze([
      '수도권인프라담당',
      '경인인프라담당',
      '중부인프라담당',
      '경남인프라담당',
      '경북인프라담당',
      '충청인프라담당',
      '호남인프라담당'
    ]);

    const POSITIONS = Object.freeze(['그룹장', '담당']);

    const firebaseConfig = {
      apiKey: "AIzaSyAioCv4Fix5U7Nj-iXgdwNwQcPtLxOfgIE",
      authDomain: "nwctc-b9e7c.firebaseapp.com",
      projectId: "nwctc-b9e7c",
      storageBucket: "nwctc-b9e7c.firebasestorage.app",
      messagingSenderId: "884751378263",
      appId: "1:884751378263:web:63f102fe2f0245b1f0c012"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    window.appState = {
      currentUser: null,
      projects: [],
      votes: [],
      editingUserId: null,
      editingProjectId: null
    };

    const byId = id => document.getElementById(id);
    const trimValue = id => byId(id).value.trim();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      })[character]);
    }

    function showMessage(message, type = 'info') {
      const container = byId('messageContainer');
      const messageElement = document.createElement('div');
      messageElement.className = `${type}-message`;
      messageElement.textContent = message;
      container.replaceChildren(messageElement);

      window.setTimeout(() => {
        messageElement.style.opacity = '0';
        window.setTimeout(() => {
          if (container.contains(messageElement)) container.replaceChildren();
        }, 300);
      }, 3200);
    }

    window.showMessage = showMessage;

    function populateSelect(selectId, values, placeholder) {
      const select = byId(selectId);
      select.replaceChildren();

      const placeholderOption = document.createElement('option');
      placeholderOption.value = '';
      placeholderOption.textContent = placeholder;
      select.appendChild(placeholderOption);

      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function saveSession(user) {
      window.appState.currentUser = user;
      try {
        sessionStorage.setItem('currentUser', JSON.stringify(user));
      } catch (error) {
        console.warn('세션 정보를 저장할 수 없습니다.', error);
      }
    }

    function clearSession() {
      window.appState.currentUser = null;
      try {
        sessionStorage.removeItem('currentUser');
      } catch (error) {
        console.warn('세션 정보를 삭제할 수 없습니다.', error);
      }
    }

    function showOnlyPage(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      byId(pageId).classList.add('active');
    }

    function projectOrganization(project) {
      if (TARGET_ORGANIZATIONS.includes(project.organization)) return project.organization;
      if (TARGET_ORGANIZATIONS.includes(project.performingOrganization)) return project.performingOrganization;
      if (TARGET_ORGANIZATIONS.includes(project.teamName)) return project.teamName;
      return '';
    }

    function projectTitle(project) {
      return project.title || project.teamName || '이름 없는 과제';
    }

    function judgeDisplayName(name, position) {
      const normalizedName = String(name || '이름 미상').trim();
      const normalizedPosition = POSITIONS.includes(position) ? position : '';
      return `${normalizedName}${normalizedPosition}님`;
    }

    function hasCompleteJudgeProfile(user) {
      return POSITIONS.includes(user?.position) && ALL_ORGANIZATIONS.includes(user?.organization);
    }

    function canJudgeVoteFor(user, project) {
      const organization = projectOrganization(project);
      if (!hasCompleteJudgeProfile(user) || !organization) return false;
      return user.position === '그룹장' || user.organization !== organization;
    }

    function organizationOrder(organization) {
      const index = TARGET_ORGANIZATIONS.indexOf(organization);
      return index === -1 ? Number.MAX_SAFE_INTEGER : index;
    }

    async function showAuthenticatedPage(user) {
      if (user.role === 'admin') {
        showOnlyPage('adminPage');
        await window.loadAdminData();
        return;
      }

      if (user.role === 'judge') {
        showOnlyPage('judgePage');
        byId('judgeName').textContent = judgeDisplayName(user.name);
        await window.loadJudgeProjects();
        return;
      }

      clearSession();
      showOnlyPage('loginPage');
      showMessage('사용자 권한을 확인할 수 없습니다.', 'error');
    }

    let databaseInitializationPromise = null;

    async function initializeDatabase() {
      const adminQuery = query(collection(db, 'users'), where('userId', '==', 'admin'));
      const adminSnapshot = await getDocs(adminQuery);

      if (!adminSnapshot.empty) return { adminCreated: false };

      await setDoc(doc(db, 'users', 'admin'), {
        name: '관리자',
        userId: 'admin',
        password: 'init1234',
        role: 'admin',
        createdAt: new Date()
      });

      return { adminCreated: true };
    }

    function ensureDatabaseInitialized() {
      if (!databaseInitializationPromise) {
        databaseInitializationPromise = initializeDatabase().catch(error => {
          databaseInitializationPromise = null;
          throw error;
        });
      }
      return databaseInitializationPromise;
    }

    window.login = async function (event) {
      event?.preventDefault();
      const userId = trimValue('loginId');
      const password = byId('loginPassword').value;

      if (!userId || !password) {
        showMessage('아이디와 비밀번호를 입력하세요.', 'error');
        return;
      }

      try {
        await ensureDatabaseInitialized();
        const userQuery = query(collection(db, 'users'), where('userId', '==', userId));
        const snapshot = await getDocs(userQuery);
        const userDocument = snapshot.docs.find(candidate => candidate.data().password === password);

        if (!userDocument) {
          showMessage('아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
          return;
        }

        const user = { id: userDocument.id, ...userDocument.data() };
        saveSession(user);
        byId('loginPassword').value = '';
        await showAuthenticatedPage(user);
      } catch (error) {
        console.error('로그인 실패:', error);
        showMessage('로그인 중 오류가 발생했습니다.', 'error');
      }
    };

    window.logout = function () {
      if (!window.confirm('로그아웃하시겠습니까?')) return;
      clearSession();
      byId('loginId').value = '';
      byId('loginPassword').value = '';
      showOnlyPage('loginPage');
      showMessage('로그아웃되었습니다.', 'info');
    };

    window.switchTab = function (tabName, clickedButton) {
      document.querySelectorAll('.tab-btn').forEach(button => button.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      const targetButton = clickedButton || document.querySelector(`.tab-btn[data-tab="${tabName}"]`);
      targetButton?.classList.add('active');
      byId(`${tabName}Tab`)?.classList.add('active');

      try {

          const vote = voteDocument.data();
          const judgeDocumentId = vote.judgeDocId || voteDocument.id;
          return getDoc(doc(db, 'users', judgeDocumentId));
        }));

        const invalidVoteIds = new Set();
        votesSnapshot.docs.forEach((voteDocument, index) => {
          const userDocument = voteUserDocuments[index];
          const user = userDocument.exists() ? userDocument.data() : voteDocument.data();
          if (user.position === '담당' && user.organization === organization) {
            invalidVoteIds.add(voteDocument.id);
          }
        });

        if (invalidVoteIds.size > 0) {
          const confirmed = window.confirm(`수행 조직을 변경하면 동일 조직 심사위원의 ${invalidVoteIds.size}표가 무효가 되어 삭제됩니다. 계속하시겠습니까?`);
          if (!confirmed) return;
        }

        const batch = writeBatch(db);
        const now = new Date();
        batch.update(doc(db, 'projects', projectId), { title, organization, updatedAt: now });

        votesSnapshot.docs.forEach(voteDocument => {
          if (invalidVoteIds.has(voteDocument.id)) {
            batch.delete(voteDocument.ref);
          } else {
            batch.update(voteDocument.ref, {
              projectTitle: title,
              projectOrganization: organization,
              updatedAt: now
            });
          }
        });

        await batch.commit();
        window.closeProjectModal();
        showMessage('과제 정보가 수정되었습니다.', 'success');
        await window.loadAdminProjects();

    window.loadAdminProjects = async function () {
      try {
        const [projectsSnapshot, votesSnapshot] = await Promise.all([
          getDocs(collection(db, 'projects')),
          getDocs(collection(db, 'votes'))
        ]);

        const votes = votesSnapshot.docs.map(voteDocument => ({ id: voteDocument.id, ...voteDocument.data() }));
        const votesByProject = new Map();
        votes.forEach(vote => {
          if (!votesByProject.has(vote.projectId)) votesByProject.set(vote.projectId, []);
          votesByProject.get(vote.projectId).push(vote);
        });

        const projects = projectsSnapshot.docs.map(projectDocument => {
          const data = { id: projectDocument.id, ...projectDocument.data() };
          data.votes = votesByProject.get(data.id) || [];
          return data;
        });

        projects.sort((left, right) => {
          const voteDifference = right.votes.length - left.votes.length;
          if (voteDifference) return voteDifference;
          const organizationDifference = organizationOrder(projectOrganization(left)) - organizationOrder(projectOrganization(right));
          if (organizationDifference) return organizationDifference;
          return projectTitle(left).localeCompare(projectTitle(right), 'ko');
        });

        window.appState.projects = projects;
        window.appState.votes = votes;

        const validVoteCount = projects.reduce((total, project) => total + project.votes.length, 0);
        byId('voteSummary').innerHTML = `
          <span class="summary-chip">평가 과제 ${projects.length}개</span>
          <span class="summary-chip">참여 심사위원 ${validVoteCount}명</span>
        `;

        const list = byId('adminProjectList');
        list.replaceChildren();

        if (projects.length === 0) {
          list.innerHTML = '<div class="empty-state">등록된 평가 과제가 없습니다.</div>';
          return;
        }

        projects.forEach(project => {
          const organization = projectOrganization(project);
          const card = document.createElement('article');
          card.className = 'card admin-project-card';
          const voters = [...project.votes].sort((left, right) => String(left.judgeName || '').localeCompare(String(right.judgeName || ''), 'ko'));

          card.innerHTML = `
            <div class="card-header">
              <div class="project-copy">
                <span class="project-title">${escapeHtml(projectTitle(project))}</span>
                <div class="badge-row">
                  <span class="organization-badge">${escapeHtml(organization || '수행 조직 미설정')}</span>

                </div>
              </div>
              <div class="badge-row">
                <span class="vote-count">${voters.length}표</span>
                <div class="project-actions">
                  <button type="button" class="edit-btn">수정</button>
                  <button type="button" class="delete-btn">삭제</button>
                </div>
              </div>
            </div>
            ${voters.length > 0 ? `
              <details class="voter-details">
                <summary>투표자 ${voters.length}명 보기</summary>
                <ul class="voter-list">
                  ${voters.map(vote => `<li>${escapeHtml(judgeDisplayName(vote.judgeName, vote.judgePosition))} · ${escapeHtml(vote.judgeOrganization || '조직 미상')}</li>`).join('')}
                </ul>

          card.querySelector('.delete-btn').addEventListener('click', () => window.deleteProject(project.id));
          list.appendChild(card);

        showMessage('과제와 투표 현황을 불러오지 못했습니다.', 'error');

    window.loadJudgeProjects = async function () {
      try {
        const currentUser = window.appState.currentUser;
        const userSnapshot = await getDoc(doc(db, 'users', currentUser.id));
        if (!userSnapshot.exists() || userSnapshot.data().role !== 'judge') {
          clearSession();
          showOnlyPage('loginPage');
          showMessage('계정 정보를 확인할 수 없습니다. 다시 로그인하세요.', 'error');
          return;
        }

        const user = { id: userSnapshot.id, ...userSnapshot.data() };
        saveSession(user);
        byId('judgeName').textContent = judgeDisplayName(user.name);
        byId('judgeProfile').textContent = `${user.position || '직책 미설정'} · ${user.organization || '소속 조직 미설정'}`;

        const [projectsSnapshot, voteSnapshot] = await Promise.all([
          getDocs(collection(db, 'projects')),
          getDoc(doc(db, 'votes', user.id))
        ]);

        const existingVote = voteSnapshot.exists() ? { id: voteSnapshot.id, ...voteSnapshot.data() } : null;
        const projects = projectsSnapshot.docs
          .map(projectDocument => ({ id: projectDocument.id, ...projectDocument.data() }))
          .sort((left, right) => {
            const organizationDifference = organizationOrder(projectOrganization(left)) - organizationOrder(projectOrganization(right));
            if (organizationDifference) return organizationDifference;
            return projectTitle(left).localeCompare(projectTitle(right), 'ko');
          });

        window.appState.projects = projects;
        window.appState.votes = existingVote ? [existingVote] : [];

        const list = byId('judgeProjectList');
        list.replaceChildren();

        if (projects.length === 0) {
          list.innerHTML = '<div class="empty-state">등록된 평가 과제가 없습니다.</div>';
        } else {
          projects.forEach(project => {
            const organization = projectOrganization(project);
            const profileIncomplete = !hasCompleteJudgeProfile(user);
            const organizationMissing = !organization;
            const sameOrganization = user.position === '담당' && user.organization === organization;
            const disabled = profileIncomplete || organizationMissing || sameOrganization;
            let disabledReason = '';

            if (profileIncomplete) disabledReason = '직책 또는 소속 조직 정보가 없어 투표할 수 없습니다. 관리자에게 문의하세요.';
            else if (organizationMissing) disabledReason = '과제 수행 조직이 설정되지 않아 투표할 수 없습니다.';
            else if (sameOrganization) disabledReason = '본인과 같은 조직이 수행한 과제에는 투표할 수 없습니다.';

            const choice = document.createElement('label');
            choice.className = `card vote-choice${disabled ? ' is-disabled' : ''}${existingVote?.projectId === project.id ? ' is-selected' : ''}`;
            choice.innerHTML = `
              <div class="vote-choice-row">
                <input type="radio" name="projectVote" value="${escapeHtml(project.id)}" ${existingVote?.projectId === project.id ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                <div class="project-copy">
                  <span class="project-title">${escapeHtml(projectTitle(project))}</span>
                  <span class="organization-badge">${escapeHtml(organization || '수행 조직 미설정')}</span>
                  ${disabledReason ? `<span class="disabled-reason">${escapeHtml(disabledReason)}</span>` : ''}
                </div>
              </div>
            `;
            choice.querySelector('input').addEventListener('change', updateVoteSelectionUI);
            list.appendChild(choice);
          });
        }

        const eligibleProjects = projects.filter(project => canJudgeVoteFor(user, project));
        const voteStatus = byId('currentVoteStatus');
        const submitButton = byId('voteSubmitButton');

        if (existingVote) {
          const selectedProject = projects.find(project => project.id === existingVote.projectId);
          voteStatus.textContent = `현재 투표: ${selectedProject ? projectTitle(selectedProject) : existingVote.projectTitle || '삭제된 과제'}`;
          submitButton.textContent = '투표 변경';
        } else {
          voteStatus.textContent = '아직 투표하지 않았습니다.';
          submitButton.textContent = '투표하기';
        }

        submitButton.disabled = !hasCompleteJudgeProfile(user) || eligibleProjects.length === 0;
        updateVoteSelectionUI();
      } catch (error) {
        console.error('평가 과제 조회 실패:', error);
        showMessage('평가 과제를 불러오지 못했습니다.', 'error');
      }
    };

    function updateVoteSelectionUI() {
      document.querySelectorAll('.vote-choice').forEach(choice => {
        const radio = choice.querySelector('input[type="radio"]');
        choice.classList.toggle('is-selected', Boolean(radio?.checked));
      });
    }

    window.submitVote = async function (event) {
      event?.preventDefault();
      const selected = document.querySelector('input[name="projectVote"]:checked:not(:disabled)');
      if (!selected) {
        showMessage('투표할 과제 하나를 선택하세요.', 'error');
        return;
      }

      const currentUser = window.appState.currentUser;
      const selectedProjectId = selected.value;

      try {
        const [userSnapshot, projectSnapshot] = await Promise.all([
          getDoc(doc(db, 'users', currentUser.id)),
          getDoc(doc(db, 'projects', selectedProjectId))
        ]);

        if (!userSnapshot.exists() || userSnapshot.data().role !== 'judge') {
          showMessage('심사위원 계정 정보를 확인할 수 없습니다.', 'error');
          return;
        }

        if (!projectSnapshot.exists()) {
          showMessage('선택한 과제가 삭제되었습니다. 목록을 새로 불러옵니다.', 'error');
          await window.loadJudgeProjects();
          return;
        }

        const user = { id: userSnapshot.id, ...userSnapshot.data() };
        const project = { id: projectSnapshot.id, ...projectSnapshot.data() };
        const organization = projectOrganization(project);

        if (!hasCompleteJudgeProfile(user)) {
          showMessage('직책과 소속 조직 정보가 필요합니다. 관리자에게 문의하세요.', 'error');
          return;
        }

        if (!organization || !TARGET_ORGANIZATIONS.includes(organization)) {
          showMessage('평가 대상 조직이 설정된 과제만 투표할 수 있습니다.', 'error');
          return;
        }

        if (!canJudgeVoteFor(user, project)) {
          showMessage('담당 심사위원은 본인과 같은 조직의 과제에 투표할 수 없습니다.', 'error');
          return;
        }

        const voteReference = doc(db, 'votes', user.id);
        const existingVoteSnapshot = await getDoc(voteReference);
        const existingVote = existingVoteSnapshot.exists() ? existingVoteSnapshot.data() : null;

        if (existingVote && existingVote.projectId !== project.id) {
          const confirmed = window.confirm(`기존 투표를 「${projectTitle(project)}」 과제로 변경하시겠습니까?`);
          if (!confirmed) return;
        }

        await setDoc(voteReference, {
          projectId: project.id,
          projectTitle: projectTitle(project),
          projectOrganization: organization,
          judgeDocId: user.id,
          judgeId: user.userId,
          judgeName: user.name,
          judgePosition: user.position,
          judgeOrganization: user.organization,
          createdAt: existingVote?.createdAt || new Date(),
          updatedAt: new Date()
        });

        showMessage(existingVote ? '투표가 반영되었습니다.' : '투표가 완료되었습니다.', 'success');
        await window.loadJudgeProjects();
      } catch (error) {
        console.error('투표 제출 실패:', error);
        showMessage('투표 처리 중 오류가 발생했습니다.', 'error');
      }
    };

    async function deleteSnapshotDocuments(snapshot) {
      const documents = snapshot.docs;
      const chunkSize = 450;

      for (let start = 0; start < documents.length; start += chunkSize) {
        const batch = writeBatch(db);
        documents.slice(start, start + chunkSize).forEach(documentSnapshot => batch.delete(documentSnapshot.ref));
        await batch.commit();
      }
    }

    window.resetVotes = async function () {
      if (!window.confirm('모든 심사위원의 투표 내역을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

      try {
        const snapshot = await getDocs(collection(db, 'votes'));
        await deleteSnapshotDocuments(snapshot);
        showMessage(`${snapshot.size}개의 투표 내역이 초기화되었습니다.`, 'success');
        await window.loadAdminProjects();
      } catch (error) {
        console.error('투표 초기화 실패:', error);
        showMessage('투표 내역 초기화 중 오류가 발생했습니다.', 'error');
      }
    };

    window.resetProjects = async function () {
      if (!window.confirm('모든 과제와 전체 투표 내역을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) return;

      try {
        const [projectsSnapshot, votesSnapshot] = await Promise.all([
          getDocs(collection(db, 'projects')),
          getDocs(collection(db, 'votes'))
        ]);
        await deleteSnapshotDocuments(votesSnapshot);
        await deleteSnapshotDocuments(projectsSnapshot);
        showMessage('모든 과제와 투표 내역이 삭제되었습니다.', 'success');
        await window.loadAdminProjects();
      } catch (error) {
        console.error('과제 초기화 실패:', error);
        showMessage('과제 초기화 중 오류가 발생했습니다.', 'error');
      }
    };

    window.resetJudges = async function () {
      if (!window.confirm('모든 심사위원 계정과 투표 내역을 삭제하시겠습니까? 관리자 계정은 유지됩니다.')) return;

      try {
        const [judgesSnapshot, votesSnapshot] = await Promise.all([
          getDocs(query(collection(db, 'users'), where('role', '==', 'judge'))),
          getDocs(collection(db, 'votes'))
        ]);
        await deleteSnapshotDocuments(votesSnapshot);
        await deleteSnapshotDocuments(judgesSnapshot);
        showMessage(`${judgesSnapshot.size}명의 심사위원과 투표 내역이 삭제되었습니다.`, 'success');
        await window.loadJudgesList();
      } catch (error) {
        console.error('심사위원 초기화 실패:', error);
        showMessage('심사위원 초기화 중 오류가 발생했습니다.', 'error');
      }
    };

    function csvCell(value) {
      const text = String(value ?? '');
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    window.exportVotesToCSV = async function () {
      try {
        const [projectsSnapshot, votesSnapshot] = await Promise.all([
          getDocs(collection(db, 'projects')),
          getDocs(collection(db, 'votes'))
        ]);

        const projects = projectsSnapshot.docs.map(projectDocument => ({ id: projectDocument.id, ...projectDocument.data() }));
        const votes = votesSnapshot.docs.map(voteDocument => voteDocument.data());
        const votesByProject = new Map();
        votes.forEach(vote => {
          if (!votesByProject.has(vote.projectId)) votesByProject.set(vote.projectId, []);
          votesByProject.get(vote.projectId).push(vote);
        });

        projects.sort((left, right) => {
          const difference = (votesByProject.get(right.id)?.length || 0) - (votesByProject.get(left.id)?.length || 0);
          return difference || projectTitle(left).localeCompare(projectTitle(right), 'ko');
        });

        if (projects.length === 0) {
          showMessage('내보낼 과제가 없습니다.', 'info');
          return;
        }

        const rows = [['순위', '과제명', '과제 수행 조직', '득표수', '투표 심사위원']];
        let rank = 0;
        let previousCount = null;
        projects.forEach((project, index) => {
          const projectVotes = votesByProject.get(project.id) || [];
          if (previousCount !== projectVotes.length) rank = index + 1;
          previousCount = projectVotes.length;
          const voterNames = projectVotes
            .map(vote => `${judgeDisplayName(vote.judgeName, vote.judgePosition)}(${vote.judgeOrganization || '조직 미상'})`)
            .join(', ');
          rows.push([rank, projectTitle(project), projectOrganization(project) || '미설정', projectVotes.length, voterNames]);
        });

        const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const now = new Date();
        const date = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
        link.href = url;
        link.download = `투표결과_${date}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showMessage('투표 결과 CSV가 다운로드되었습니다.', 'success');
      } catch (error) {
        console.error('CSV 내보내기 실패:', error);
        showMessage('CSV 생성 중 오류가 발생했습니다.', 'error');
      }
    };

    window.loadAdminData = async function () {
      await Promise.all([window.loadAdminProjects(), window.loadJudgesList()]);
    };

    async function restoreSession() {
      let savedUser = null;
      try {
        const saved = sessionStorage.getItem('currentUser');
        if (saved) savedUser = JSON.parse(saved);
      } catch (error) {
        console.warn('세션 정보를 복원할 수 없습니다.', error);
      }

      if (!savedUser?.id) return;

      try {
        const snapshot = await getDoc(doc(db, 'users', savedUser.id));
        if (!snapshot.exists()) {
          clearSession();
          return;
        }

        const freshUser = { id: snapshot.id, ...snapshot.data() };
        saveSession(freshUser);
        await showAuthenticatedPage(freshUser);
      } catch (error) {
        console.error('로그인 상태 복원 실패:', error);
        clearSession();
      }
    }

    function closeModalOnBackdrop(event) {
      if (event.target === byId('editUserModal')) window.closeUserModal();
      if (event.target === byId('editProjectModal')) window.closeProjectModal();
    }

    async function boot() {
      populateSelect('projectOrganization', TARGET_ORGANIZATIONS, '과제 수행 조직을 선택하세요');
      populateSelect('editProjectOrganization', TARGET_ORGANIZATIONS, '과제 수행 조직을 선택하세요');
      populateSelect('userOrganization', ALL_ORGANIZATIONS, '소속 조직을 선택하세요');
      populateSelect('editOrganization', ALL_ORGANIZATIONS, '소속 조직을 선택하세요');
      byId('editUserModal').addEventListener('click', closeModalOnBackdrop);
      byId('editProjectModal').addEventListener('click', closeModalOnBackdrop);

      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        window.closeUserModal();
        window.closeProjectModal();
      });

      try {
        const result = await ensureDatabaseInitialized();
        if (result.adminCreated) showMessage('초기 관리자 계정이 생성되었습니다.', 'success');
      } catch (error) {
        console.error('데이터베이스 초기화 실패:', error);
        showMessage('데이터베이스 초기화에 실패했습니다. 로그인 시 다시 시도합니다.', 'error');
      }

      await restoreSession();
    }

    boot();
  </script>
</body>

</html>
